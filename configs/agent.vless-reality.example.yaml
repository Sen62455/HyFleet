server_url: https://hyfleet.example.com
enrollment_token_env: HYFLEET_ENROLLMENT_TOKEN
node_name: edge-reality
adapter_type: sing_box_vless_reality
core_name: sing-box
service_unit: hyfleet-sing-box-reality.service
core_config_path: /etc/sing-box/hyfleet-reality.json
sing_box_binary_path: /usr/bin/sing-box
operations_state_dir: /var/lib/hyfleet-agent-ops
backup_dir: /var/lib/hyfleet-backups
reality_identity_path: /var/lib/hyfleet-agent-ops/reality-hyfleet-sing-box-reality.json
operations_socket_path: /run/hyfleet-agent-ops.sock
state_path: /var/lib/hyfleet-agent/agent-state.json
local_database_path: /var/lib/hyfleet-agent/agent.db
heartbeat_every: 15s
telemetry_every: 60s
desired_every: 10s
traffic_every: 30s
